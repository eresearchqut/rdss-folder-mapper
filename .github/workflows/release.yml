name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── CLI ─────────────────────────────────────────────────────────────────────
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI executables
        run: npm run build --workspace=cli

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/rdss-folder-mapper-*

  # ── GUI (per-OS, built with Tauri) ───────────────────────────────────────────
  build-gui:
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            bundles: "--bundles dmg"
            artifact: "gui/src-tauri/target/release/bundle/dmg/*.dmg"
          - os: windows-latest
            name: windows
            bundles: "--bundles nsis"
            artifact: "gui/src-tauri/target/release/bundle/nsis/*.exe"
          - os: ubuntu-latest
            name: linux
            bundles: "--bundles appimage"
            artifact: "gui/src-tauri/target/release/bundle/appimage/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Download CLI binaries (sidecar)
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist

      - name: Build GUI (Tauri)
        run: npm run tauri --workspace=gui -- build ${{ matrix.bundles }}

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  # ── Release ──────────────────────────────────────────────────────────────────
  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Release (versioned tag)
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          files: release-files/**
