name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── CLI ─────────────────────────────────────────────────────────────────────
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI executables
        run: npm run build --workspace=cli

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/rdss-folder-mapper-*

  # ── GUI (per-OS) ─────────────────────────────────────────────────────────────
  build-gui:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifact: |
              gui/release/*.dmg
              gui/release/*.pkg
          - os: windows-latest
            name: windows
            artifact: "gui/release/*.exe"
          - os: ubuntu-latest
            name: linux
            artifact: "gui/release/*.AppImage"

    runs-on: ${{ matrix.os }}

    env:
      # Surfaced so step-level `if` can gate on secret presence without
      # referencing the secrets context directly in conditionals.
      HAS_MAC_SIGNING: ${{ secrets.MAC_CERT_APP_P12 != '' }}
      # Azure Trusted Signing credential presence gates the signed Windows build.
      # Absent on forks / PRs / repos without the secret, producing unsigned .exe.
      HAS_WIN_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI (required by GUI bundle)
        run: npm run build:ts --workspace=cli

      # Import the Developer ID Application (signs the .app/.dmg) and Developer
      # ID Installer (signs the .pkg) certificates into a temporary keychain so
      # electron-builder can auto-discover both identities. Skipped when the
      # signing secrets are absent (forks / PRs), producing unsigned builds.
      - name: Import Apple signing certificates
        if: matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true'
        env:
          MAC_CERT_APP_P12: ${{ secrets.MAC_CERT_APP_P12 }}
          MAC_CERT_INSTALLER_P12: ${{ secrets.MAC_CERT_INSTALLER_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERT_APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$MAC_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          if [ -n "$MAC_CERT_INSTALLER_P12" ]; then
            echo "$MAC_CERT_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -P "$MAC_CERT_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

      # Windows: sign with Azure Trusted Signing. electron-builder installs the
      # `TrustedSigning` PowerShell module and runs `Invoke-TrustedSigning` for
      # every produced executable/installer. The AZURE_* env vars authenticate to
      # Microsoft Entra ID (EnvironmentCredential); the non-secret account /
      # profile / endpoint / publisher come from repository variables so they can
      # be reconfigured without a code change. Only runs when the signing secret
      # is present, so forks / PRs still get an unsigned build via the step below.
      - name: Package GUI (Windows, Azure Trusted Signing)
        if: matrix.os == 'windows-latest' && env.HAS_WIN_SIGNING == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Baked into the GUI bundle at build time (see gui/build.js). Absent on
          # forks / secret-less runs, falling back to the local testing id.
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          # Default Umami collect host baked in at build time; a deployment
          # config.json (umamiHost) can still override it at runtime. Non-secret,
          # so a repository variable. Falls back to the built-in default when unset.
          UMAMI_HOST: ${{ vars.UMAMI_HOST }}
        run: >-
          npm run dist --workspace=gui --
          "--config.win.azureSignOptions.publisherName=${{ vars.WIN_PUBLISHER_NAME }}"
          "--config.win.azureSignOptions.endpoint=${{ vars.AZURE_TS_ENDPOINT }}"
          "--config.win.azureSignOptions.codeSigningAccountName=${{ vars.AZURE_TS_ACCOUNT }}"
          "--config.win.azureSignOptions.certificateProfileName=${{ vars.AZURE_TS_PROFILE }}"

      - name: Package GUI
        if: ${{ !(matrix.os == 'windows-latest' && env.HAS_WIN_SIGNING == 'true') }}
        env:
          # Used by build/notarize.js (afterSign hook). Empty on non-mac /
          # secret-less runs, which makes notarization skip gracefully.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Baked into the GUI bundle at build time (see gui/build.js). Absent on
          # forks / secret-less runs, falling back to the local testing id.
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          # Default Umami collect host baked in at build time; a deployment
          # config.json (umamiHost) can still override it at runtime. Non-secret,
          # so a repository variable. No tracking when unset and no config host.
          UMAMI_HOST: ${{ vars.UMAMI_HOST }}
        run: npm run dist --workspace=gui

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  # ── Release ──────────────────────────────────────────────────────────────────
  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Release (versioned tag)
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**

      # action-gh-release won't move an existing tag, so the rolling "latest"
      # tag/release would otherwise stay pinned to the commit it was first
      # created at. Delete it (and its tag) so the next step recreates it at
      # the current commit with fresh metadata.
      - name: Remove previous 'latest' release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release-files/**
