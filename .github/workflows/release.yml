name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── CLI ─────────────────────────────────────────────────────────────────────
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI executables
        run: npm run build --workspace=cli

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: cli/dist/rdss-folder-mapper-*

  # ── GUI (per-OS) ─────────────────────────────────────────────────────────────
  build-gui:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifact: "gui/release/*.dmg"
          - os: windows-latest
            name: windows
            artifact: "gui/release/*.exe"
          - os: ubuntu-latest
            name: linux
            artifact: "gui/release/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI (required by GUI bundle)
        run: npm run build:ts --workspace=cli

      - name: Package GUI
        run: npm run dist --workspace=gui

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  # ── Release ──────────────────────────────────────────────────────────────────
  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Release (versioned tag)
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          files: release-files/**
